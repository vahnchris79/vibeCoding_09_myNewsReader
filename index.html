<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="IT, 비즈니스, 경제 주제를 선택하여 최신 기사를 모아보는 맞춤형 뉴스 리더 웹앱">
  <title>맞춤형 뉴스 리더</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 헤더 및 주제 선택 영역 -->
  <header class="app-header">
    <div class="header-container">
      <h1 class="app-title">맞춤형 뉴스 리더</h1>
      
      <form id="topic-form" class="topic-form">
        <fieldset class="topic-fieldset">
          <legend class="sr-only">뉴스 주제 선택</legend>
          <div class="checkbox-group" id="topic-checkboxes">
            <label class="topic-checkbox-label">
              <input type="checkbox" name="topic" value="IT" checked>
              <span class="custom-checkbox"></span>
              <span class="topic-text">IT</span>
            </label>
            <label class="topic-checkbox-label">
              <input type="checkbox" name="topic" value="비즈니스" checked>
              <span class="custom-checkbox"></span>
              <span class="topic-text">비즈니스</span>
            </label>
            <label class="topic-checkbox-label">
              <input type="checkbox" name="topic" value="경제" checked>
              <span class="custom-checkbox"></span>
              <span class="topic-text">경제</span>
            </label>
          </div>
          <button type="submit" id="view-news-btn" class="btn-primary">뉴스보기</button>
        </fieldset>
      </form>
    </div>
  </header>

  <!-- 메인 뉴스 피드 영역 -->
  <main class="main-container">
    <div id="status-message" class="status-message" aria-live="polite"></div>
    
    <!-- 반응형 뉴스 카드 그리드 -->
    <div id="news-feed" class="news-grid" aria-label="뉴스 피드"></div>

    <!-- 무한 스크롤 감지 영역 -->
    <div id="scroll-sentinel" class="scroll-sentinel">
      <div id="loading-indicator" class="loading-indicator" style="display: none;">
        <div class="spinner"></div>
        <p class="loading-text">추가 기사 10건을 불러오는 중...</p>
      </div>
    </div>
  </main>

  <!-- 기사 본문 모달 창 -->
  <div id="article-modal" class="modal-backdrop" role="dialog" aria-modal="true" aria-hidden="true">
    <div class="modal-dialog">
      <button id="modal-close-btn" class="modal-close-btn" aria-label="모달 닫기">&times;</button>
      <div class="modal-content">
        <div class="modal-header">
          <span id="modal-topic" class="topic-badge"></span>
          <h2 id="modal-title" class="modal-title"></h2>
        </div>
        <div class="modal-image-wrapper">
          <img id="modal-image" src="" alt="기사 이미지">
        </div>
        <div id="modal-body-content" class="modal-body"></div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
